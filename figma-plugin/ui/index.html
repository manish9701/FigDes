<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Design Agent</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: var(--figma-color-bg, #ffffff);
        --bg-2: var(--figma-color-bg-secondary, #f5f5f5);
        --text: var(--figma-color-text, #000000);
        --text-2: var(--figma-color-text-secondary, #777777);
        --text-3: var(--figma-color-text-tertiary, #999999);
        --border: var(--figma-color-border, #e0e0e0);
        --brand: var(--figma-color-bg-brand, #0d99ff);
        --green: #14ae5c;
        --amber: #ffcd29;
        --red: #f24822;
        --radius: 6px;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 10px;
        font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 11px;
        line-height: 1.45;
        background: var(--bg);
        color: var(--text);
      }

      /* ------------------------------- header ------------------------------ */

      header {
        display: flex;
        align-items: center;
        gap: 7px;
        margin-bottom: 9px;
      }

      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #bbb;
        flex: 0 0 auto;
      }

      .dot.connected {
        background: var(--green);
      }

      .dot.connecting {
        background: var(--amber);
      }

      .dot.error {
        background: var(--red);
      }

      #file {
        font-weight: 600;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 130px;
      }

      #page {
        color: var(--text-3);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .spacer {
        flex: 1 1 auto;
      }

      button {
        font: inherit;
        padding: 4px 7px;
        border-radius: 5px;
        border: 1px solid var(--border);
        background: var(--bg-2);
        color: inherit;
        cursor: pointer;
      }

      button:hover {
        border-color: var(--text-3);
      }

      button.primary {
        background: var(--brand);
        border-color: transparent;
        color: #fff;
      }

      /* -------------------------------- cards ----------------------------- */

      .note {
        color: var(--text-3);
        font-size: 10px;
        margin-top: 5px;
      }

      #progress {
        height: 3px;
        border-radius: 2px;
        background: var(--bg-2);
        margin-top: 8px;
        overflow: hidden;
        visibility: hidden;
      }

      #progress-bar {
        height: 100%;
        width: 0%;
        border-radius: 2px;
        background: var(--brand);
        transition: width 120ms linear;
      }

      #progress-label {
        color: var(--text-2);
        font-size: 10px;
        margin-top: 4px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        visibility: hidden;
      }

      /* ------------------------------- details ---------------------------- */

      summary {
        cursor: pointer;
        color: var(--text-2);
        padding: 3px 0;
        font-size: 10px;
        font-weight: 600;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      .row {
        display: flex;
        gap: 6px;
        margin: 6px 0;
      }

      input {
        font: inherit;
        flex: 1 1 auto;
        min-width: 0;
        padding: 4px 6px;
        border-radius: 5px;
        border: 1px solid var(--border);
        background: var(--bg-2);
        color: inherit;
      }

      #log {
        max-height: 96px;
        overflow-y: auto;
        padding: 5px;
        border-radius: 5px;
        background: var(--bg-2);
        color: var(--text-2);
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 10px;
        white-space: pre-wrap;
        word-break: break-word;
      }

      .warn {
        color: #b26a00;
      }

      .error {
        color: #d13415;
      }
    </style>
  </head>
  <body>
    <header>
      <span id="dot" class="dot"></span>
      <span id="file">Loading...</span>
      <span id="page"></span>
      <span class="spacer"></span>
      <span id="version" style="color: var(--text-3)"></span>
    </header>
    <div id="progress"><div id="progress-bar"></div></div>
    <div id="progress-label"></div>

    <details id="settings" style="margin-bottom: 8px">
      <summary>Server connection</summary>
      <div class="row">
        <input id="url" placeholder="http://localhost:8787" spellcheck="false" />
        <button id="save">Apply</button>
      </div>
      <div class="row">
        <input id="secret" type="password" placeholder="PLUGIN_SECRET (if required)" spellcheck="false" />
      </div>
      <div class="note">ChatGPT uses the public tunnel URL printed by `npm start`, not this localhost address.</div>
    </details>

    <details id="logdetails">
      <summary>Activity log</summary>
      <div id="log"></div>
    </details>

    <script>
      // Fires if the UI bundle fails to execute, so the panel can never sit on
      // "Loading..." forever with no explanation.
      window.addEventListener("load", function () {
        setTimeout(function () {
          var f = document.getElementById("file");
          if (f && f.textContent === "Loading...") {
            f.textContent = "UI bundle did not run - rebuild with npm run build";
            f.style.color = "#d13415";
          }
        }, 5000);
      });
    </script>
    <script src="./ui.js"></script>
  </body>
</html>
