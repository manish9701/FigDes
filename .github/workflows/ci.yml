# Design generation is treated as code output that can be tested (report §17):
# every push builds the plugin and server, typechecks, runs the mock-harness suites,
# and executes the offline planning benchmark. Live Figma rendering remains manual.
name: ci

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Issue #14's definition of done: reports carry the exact commit and the
      # totals, so a run can be identified afterwards rather than described from
      # memory. `git rev-parse HEAD` is written into the GITHUB_STEP_SUMMARY with
      # the counts, which is the artifact that gets quoted.
      - name: Record what is being tested
        run: |
          echo "commit $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          echo "branch  ${{ github.ref_name }}" >> "$GITHUB_STEP_SUMMARY"
      - run: npm run build
      - run: npm run typecheck
      - name: Report test totals
        run: |
          set -o pipefail
          npm test 2>&1 | tee /tmp/test.log
          {
            echo ""
            echo "### Test totals"
            echo ""
            echo '```'
            grep -E "^# (tests|pass|fail|cancelled|skipped)" /tmp/test.log | tail -60 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Run design-planning benchmark
        run: npm run benchmark:design
      # Issue #12: the stress matrix is offline, so it runs here. Strict, because
      # every case passes: the four known-failing layout bugs are fixed, and a
      # regression in any of them has to turn the build red rather than quietly
      # becoming another open case.
      - name: Run issue #12 stress matrix
        run: npm run stress:matrix -- --strict
      - name: Upload stress matrix report
        uses: actions/upload-artifact@v4
        with:
          name: figdes-stress-matrix
          path: artifacts/stress-matrix/latest.json
          if-no-files-found: error
      # Issue #13/#14's acceptance gate, strict for the same reason as the stress
      # matrix above. The three open cases are real defects in the compiler and
      # the reviewer — an invisible active nav label, a region occluded by its
      # left sibling, a connector with no endpoints — not an availability
      # problem, so red here is the gate working. They were listed as
      # infrastructure failures only while the hosted apply was timing out;
      # L04 closed once the complete frame landed.
      - name: Run acceptance matrix
        run: npm run acceptance -- --strict
      - name: Upload acceptance report
        uses: actions/upload-artifact@v4
        with:
          name: figdes-acceptance
          path: artifacts/acceptance/latest.json
          if-no-files-found: error
      - name: Upload benchmark report
        uses: actions/upload-artifact@v4
        with:
          name: figdes-design-benchmark
          path: artifacts/design-benchmark/latest.json
          if-no-files-found: error
      # Issue #17: the release gate. It runs the integrated gauntlet, every
      # offline regression suite, the acceptance and stress matrices and the
      # design benchmark, and produces one evidence bundle and one verdict.
      #
      # The live group is skipped here because a runner has no Figma plugin:
      # the gate reports that coverage as BLOCKED rather than as a pass, and
      # the verdict is INDETERMINATE rather than PASS. A failure is still a
      # failure, so a red gate turns the build red.
      - name: Run the release gate
        run: npm run gate -- --skip-live
      - name: Upload the release-gate evidence
        uses: actions/upload-artifact@v4
        with:
          name: figdes-release-gate
          path: artifacts/release-gate/
          if-no-files-found: error
      # Live Figma evidence cannot be produced on a runner, so this step does not
      # gate the build. It publishes the live report so the stress frame
      # (issue #10's "rendered and reviewed after the final mutation") stays
      # visible rather than quietly unevidenced. Run `npm run benchmark:live --
      # strict` locally with the plugin connected to make it a hard gate.
      - name: Report live Figma evidence
        run: npm run benchmark:live
      - name: Upload live evidence report
        uses: actions/upload-artifact@v4
        with:
          name: figdes-live-report
          path: artifacts/design-benchmark/live-report.json
          if-no-files-found: warn
