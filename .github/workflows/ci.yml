# Design generation is treated as code output that can be tested (report §17):
# every push builds the plugin and server, typechecks, runs the mock-harness suites,
# and executes the offline planning benchmark. Live Figma rendering remains manual.
name: ci

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
      - name: Run design-planning benchmark
        run: npm run benchmark:design
      - name: Upload benchmark report
        uses: actions/upload-artifact@v4
        with:
          name: figdes-design-benchmark
          path: artifacts/design-benchmark/latest.json
          if-no-files-found: error
